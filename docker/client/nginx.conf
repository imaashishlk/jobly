server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this server. Requests to /api are passed on to the API container, so the
    # React app and the API share one address and no CORS setup is needed. "api" is the compose service name.
    location /api/ {
        # nginx refuses request bodies over 1 MB by default. A CV file can be 5 MB (plus a little form overhead).
        client_max_body_size 6m;

        # Analyzing a job asks a language model that runs on a CPU, which can take minutes. The API gives up after
        # 300 seconds, so nginx waits a little longer than that. The default of 60 seconds would cut the call off.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;

        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the React app. Unknown paths fall back to index.html, so the app can handle its own routes.
    location / {
        try_files $uri /index.html;
    }

    # Built files have a hash in their name, so browsers may keep them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
