# The whole local stack. Run from the repository root:
#   docker compose -f docker/docker-compose.yml up -d --build    start or rebuild
#   docker compose -f docker/docker-compose.yml ps               what's running
#   docker compose -f docker/docker-compose.yml logs api         logs of one service
#   docker compose -f docker/docker-compose.yml down             stop (data is kept; never add -v)
#
# Settings come from docker/.env (copy docker/.env.example and fill it in). ${NAME:-default} uses the
# value from .env when set, otherwise the default after ":-".

name: jobly

services:
  api:
    build:
      context: ..                       # The repository root, so the Dockerfile can copy src/ and the props files.
      dockerfile: docker/api/Dockerfile
    ports:
      # 127.0.0.1 = reachable only from your own machine, not from other devices on your network.
      # Also avoids a Docker Desktop IPv6 issue that breaks http://localhost on Windows.
      - "127.0.0.1:${JOBLY_API_PORT:-48217}:8080" # your machine : container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # "__" becomes ":" in .NET configuration, so this is the setting ConnectionStrings:Jobly.
      # The value comes from docker/.env. ":?" stops compose with this message if it is missing.
      ConnectionStrings__Jobly: "${JOBLY_CONNECTION_STRING:?Set JOBLY_CONNECTION_STRING in docker/.env (copy docker/.env.example)}"
    depends_on:
      postgres:
        # Start the API only after PostgreSQL accepts connections (see the healthcheck below), so it never starts against a database that isn't ready.
        condition: service_healthy

  client:
    build:
      context: ..                       # The repository root, so the Dockerfile can copy client/.
      dockerfile: docker/client/Dockerfile
    ports:
      - "127.0.0.1:${JOBLY_CLIENT_PORT:-48251}:8080" # Open http://127.0.0.1:48251 in the browser.
    depends_on:
      - api                             # nginx passes /api requests to the api service (see docker/client/nginx.conf).

  postgres:
    # PostgreSQL 17 with the pgvector extension installed (not switched on yet; the first vector column's migration does that).
    # Pinned version, so every machine runs the same database.
    image: pgvector/pgvector:0.8.0-pg17
    ports:
      - "127.0.0.1:${JOBLY_DB_PORT:-48233}:5432"   # Only your machine can connect (for example from VS Code or DBeaver).
    environment:
      POSTGRES_USER: jobly
      POSTGRES_DB: jobly                            # Created automatically on the first start, so the migration only creates tables.
      # ":?" stops compose with this message if the password is missing, instead of starting a broken database.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env (copy docker/.env.example)}"
    volumes:
      - postgres-data:/var/lib/postgresql/data      # A named volume keeps the database when containers stop or are rebuilt.
    healthcheck:
      # Healthy once PostgreSQL accepts connections for our user and database.
      test: ["CMD-SHELL", "pg_isready -U jobly -d jobly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
